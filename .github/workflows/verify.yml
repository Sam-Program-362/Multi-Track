name: Verify

# Runs the numerical and migration test suites, plus typecheck and both builds,
# on every pull request and on pushes to main. This is the gate that keeps the
# web app and the Android bundle on the same scheduling model.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web app — typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Vitest includes the independent `adhan` cross-check, the calibration
      # algebra, the API write decisions and the Android storage migrations.
      - name: Tests
        run: npm test

      # The build only needs *a* DATABASE_URL; no connection is made while
      # prerendering (every data route is dynamic).
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://user:password@127.0.0.1:5432/placeholder

  android:
    name: Android bundle — typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json

      # `sharp` postinstall hits a certificate problem on this image; nothing in
      # the static export needs its native binary.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build static bundle
        run: npm run build
