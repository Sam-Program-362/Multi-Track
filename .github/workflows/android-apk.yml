name: Android APK

# Builds the signed Android APK for the standalone app in android/.
#
#   push to main touching android/**  -> automatic build
#   manual dispatch                   -> rebuild on demand
#
# Secrets required for a signed release (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# If they are missing the workflow still succeeds and publishes a debug APK.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The standalone app lives under android/, so every run step starts there.
    # Steps that need the repository root override this explicitly.
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 8's CLI refuses to run on anything older than Node 22.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json

      # Capacitor 8 builds against Android Gradle Plugin 8.13 / SDK 36, which
      # asks for JDK 21 (17+ still works, but 21 is what it is tested on).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package list asks for the retired "tools" package, which
          # makes the action fail, so the packages we actually need are listed.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Read app version
        id: version
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # versionCode has to grow on every build or Android refuses to install
      # the APK as an update, so it is derived from the workflow run number.
      # run_attempt keeps retries monotonic within the same run.
      - name: Resolve Android versionCode and versionName
        id: apk_version
        run: |
          echo "code=$(( ${GITHUB_RUN_NUMBER} * 1000 + ${GITHUB_RUN_ATTEMPT} ))" >> "$GITHUB_OUTPUT"
          echo "name=${{ steps.version.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are missing - building a debug APK instead."
          fi

      - name: Build the static web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # The native project is android/android and Gradle reads the keystore from
      # its own root, so the decoded key lands next to settings.gradle.
      - name: Decode release keystore
        if: steps.secrets.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          chmod 600 android/release.jks
          keytool -list -keystore android/release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Build signed release APK
        if: steps.secrets.outputs.available == 'true'
        working-directory: android/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APK_VERSION_CODE: ${{ steps.apk_version.outputs.code }}
          APK_VERSION_NAME: ${{ steps.apk_version.outputs.name }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: steps.secrets.outputs.available != 'true'
        working-directory: android/android
        env:
          APK_VERSION_CODE: ${{ steps.apk_version.outputs.code }}
          APK_VERSION_NAME: ${{ steps.apk_version.outputs.name }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect the APK
        id: apk
        env:
          AVAILABLE: ${{ steps.secrets.outputs.available }}
        run: |
          if [ "$AVAILABLE" = "true" ]; then
            source="android/app/build/outputs/apk/release/app-release.apk"
          else
            source="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$source" "Multi-Track.apk"
          echo "path=android/Multi-Track.apk" >> "$GITHUB_OUTPUT"

      - name: Verify the APK signature
        if: steps.secrets.outputs.available == 'true'
        working-directory: .
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs "$APK"

      - name: Delete the decoded keystore
        if: always()
        run: rm -f android/release.jks

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Track-${{ steps.apk_version.outputs.name }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      # Tagging a release is what makes the APK downloadable from the phone.
      - name: Publish a GitHub Release
        # Branch/manual test builds still upload an APK artifact, but only main
        # publishes a downloadable GitHub Release.
        if: steps.secrets.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.apk_version.outputs.name }}-${{ github.run_number }}
          name: Multi-Track ${{ steps.apk_version.outputs.name }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            Multi-Track ${{ steps.apk_version.outputs.name }} (build ${{ github.run_number }})

            The latest build is always at:

            https://github.com/Sam-Program-362/Multi-Track/releases/latest/download/Multi-Track.apk

            Android replaces the previous version and keeps your saved data.
